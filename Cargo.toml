[package]
name = "machaca"
version = "0.1.0"
edition = "2024"
description = "machaca: el panel de discada (SUPER+Shift+E), con el look del rice"
license = "MIT"

[dependencies]
disco = { git = "https://github.com/daniiiqa/disco", features = ["paint"] }
libc = "0.2"
ratatui = "0.29"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = "0.12.0"
toml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
